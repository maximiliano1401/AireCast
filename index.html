<!doctype html><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'">
<title>AireCast MVP</title>
<style>
  body{margin:0;font-family:Segoe UI,system-ui;background:#0f172a;color:#e2e8f0;padding:20px 24px}
  h1{margin:0 0 2px;font-size:22px}p.sub{margin:0 0 14px;opacity:.65}
  button{font-size:14px;padding:9px 14px;border:0;border-radius:8px;background:#3b82f6;color:#fff;cursor:pointer}
  button:disabled{opacity:.4;cursor:default}button.ghost{background:#334155}button.stop{background:#ef4444}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  ul{list-style:none;padding:0;margin:12px 0}
  li{padding:10px 12px;border:1px solid #334155;border-radius:10px;margin-bottom:8px;cursor:pointer}
  li.sel{border-color:#3b82f6;background:#1e293b}
  li small{opacity:.6;display:block}
  .tag{font-size:11px;padding:2px 6px;border-radius:6px;background:#334155;margin-left:6px}
  #pair{display:none;margin:8px 0}#pair input{font-size:16px;width:90px;padding:8px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#fff;text-align:center}
  #status{margin:10px 0;min-height:20px}
  pre{height:120px;overflow:auto;background:#020617;border-radius:8px;padding:8px;font-size:11px;white-space:pre-wrap;margin:0}
</style>
<h1>📡 AireCast MVP</h1>
<p class="sub">Envía vídeo, audio o tu pantalla a televisores y altavoces AirPlay.</p>
<div class="row"><button id="scanBtn" class="ghost">🔍 Buscar dispositivos</button></div>
<ul id="list"></ul>
<div id="pair" class="row">Escribe el PIN que aparece en la TV: <input id="pin" maxlength="4" inputmode="numeric"><button id="pinBtn">Emparejar</button></div>
<div class="row">
  <button id="screenBtn" disabled>🖥️ Compartir pantalla</button>
  <button id="videoBtn" disabled>🎬 Enviar vídeo</button>
  <button id="audioBtn" disabled>🎵 Enviar audio</button>
  <button id="stopBtn" class="stop" disabled>■ Detener</button>
</div>
<div id="status"></div>
<pre id="log"></pre>
<script>
  let devices = [], sel = null;
  const $ = (id) => document.getElementById(id);
  const status = (t) => ($("status").textContent = t);
  const addLog = (t) => { $("log").textContent += t; $("log").scrollTop = 1e9; };
  pc.onLog(addLog);

  function refresh() {
    const d = devices.find((x) => x.id === sel);
    const ready = d && (!d.needs_pairing || d.paired);
    $("pair").style.display = d && d.needs_pairing && !d.paired ? "flex" : "none";
    $("screenBtn").disabled = $("videoBtn").disabled = !(ready && d.video);
    $("audioBtn").disabled = !(ready && d.audio);
    $("list").innerHTML = "";
    for (const x of devices) {
      const li = document.createElement("li");
      li.className = x.id === sel ? "sel" : "";
      const tags = [x.video && "vídeo", x.audio && "audio", x.needs_pairing && (x.paired ? "emparejado" : "requiere PIN")].filter(Boolean);
      li.innerHTML = `<b></b>${tags.map((t) => `<span class="tag">${t}</span>`).join("")}<small></small>`;
      li.querySelector("b").textContent = x.name;
      li.querySelector("small").textContent = `${x.model} · ${x.address}`;
      li.onclick = async () => {
        sel = x.id; refresh();
        if (x.needs_pairing && !x.paired) {
          status("Pidiendo PIN a la TV…");
          try { await pc.pairBegin(x.id); status("Mira la TV y escribe el PIN."); $("pin").focus(); }
          catch (e) { status("No se pudo iniciar el emparejamiento: " + e.message); }
        }
      };
      $("list").appendChild(li);
    }
  }

  async function scan() {
    $("scanBtn").disabled = true; status("Buscando en la red…");
    try { devices = await pc.scan(); status(`${devices.length} dispositivo(s) encontrados.`); }
    catch (e) { status("Error al buscar: " + e.message); }
    $("scanBtn").disabled = false; refresh();
  }

  async function run(label, fn) {
    const d = devices.find((x) => x.id === sel);
    status(`${label} en ${d.name}…`);
    try { const r = await fn(d); if (r) { status(`▶ ${label} en ${d.name}`); $("stopBtn").disabled = false; } else status(""); }
    catch (e) { status(`Error: ${e.message}`); }
  }

  $("scanBtn").onclick = scan;
  $("pinBtn").onclick = async () => {
    try { await pc.pairPin(sel, $("pin").value.trim()); devices.find((x) => x.id === sel).paired = true; status("✅ Emparejado."); }
    catch (e) { status("Emparejamiento fallido: " + e.message + ". Vuelve a seleccionar la TV para pedir otro PIN."); }
    $("pin").value = ""; refresh();
  };
  $("screenBtn").onclick = () => run("Compartiendo pantalla", pc.shareScreen);
  $("videoBtn").onclick = () => run("Reproduciendo vídeo", pc.sendVideo);
  $("audioBtn").onclick = () => run("Reproduciendo audio", pc.sendAudio);
  $("stopBtn").onclick = async () => { await pc.stop(); status("Detenido."); $("stopBtn").disabled = true; };
  pc.onPlayback((m) => {
    if (m.event === "info") return addLog(m.message + "\n");
    if (m.event === "error") status(`Error de reproducción: ${m.error}`);
    if (m.event === "ended") status("Reproducción terminada.");
    $("stopBtn").disabled = true;
  });
  scan();
</script>
