# Al subir una etiqueta v*, genera los paquetes y crea un borrador de release con ellos.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: dotnet test core/AireCast.Core.Tests
      - run: packaging/linux/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/packages/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: choco install innosetup -y
      - run: packaging\windows\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/packages/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: dotnet workload install android
      - run: dotnet build core/AireCast.Android -t:InstallAndroidDependencies -p:AcceptAndroidSDKLicenses=True -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME"
      - env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE="$RUNNER_TEMP/airecast.keystore"
          base64 -d <<< "$ANDROID_KEYSTORE_BASE64" > "$ANDROID_KEYSTORE"
          packaging/android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/packages/*

  release:
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" packages/* --draft --generate-notes --repo "$GITHUB_REPOSITORY"
